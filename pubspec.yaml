name: so_thu_chi
description: "Sổ thu chi cá nhân — offline hoàn toàn, không quảng cáo."
publish_to: 'none'
version: 1.0.3+4

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  # Bản địa hoá tiếng Việt cho widget của SDK: DatePicker, nút Huỷ/OK,
  # tên thứ và tháng. Thiếu nó thì lịch chọn ngày hiện tiếng Anh.
  flutter_localizations:
    sdk: flutter

  # --- State management: Riverpod 3 + code generation (file 06 mục 3.1) ---
  flutter_riverpod: ^3.4.2
  riverpod_annotation: ^4.0.6

  # --- Database (file 06 mục 3.2) ---
  # sqlite3_flutter_libs đã EOL: package:sqlite3 3.x tự nhúng native libs,
  # drift_flutter kéo sẵn. Không khai báo trực tiếp nữa.
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  path: ^1.9.1

  # --- Điều hướng & định dạng ---
  go_router: ^17.5.0
  intl: ^0.20.3
  shared_preferences: ^2.5.5

  # --- Giao diện (file 06 mục 3.4) ---
  flex_color_scheme: ^8.4.0
  cupertino_icons: ^1.0.8
  fl_chart: ^1.2.0
  csv: ^8.0.0
  excel: ^4.0.6
  archive: ^3.6.1
  share_plus: ^13.3.0
  file_picker: ^12.0.0
  flutter_local_notifications: ^22.3.0
  local_auth: ^3.0.2
  package_info_plus: ^10.2.1
  crypto: ^3.0.7
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  home_widget: ^0.9.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.10.3
  drift_dev: ^2.34.3
  riverpod_generator: ^4.0.8
  riverpod_lint: ^3.1.8
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true

  # Font nhúng tĩnh — app offline không phụ thuộc mạng để hiển thị chữ
  # (file 07 mục 2.4). Be Vietnam Pro: dấu tiếng Việt cân đối.
  fonts:
    - family: BeVietnamPro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro-Bold.ttf
          weight: 700

# ── Icon app ──────────────────────────────────────────────────────────────────
# KHÔNG dùng flutter_launcher_icons: gói này giải về bản 0.9.3 (xung đột phiên
# bản `image` với flutter_native_splash), và bản đó đọc `build.gradle` kiểu
# Groovy để lấy minSdk — project này dùng Kotlin DSL nên nó sập.
#
# Icon được sinh thẳng vào android/app/src/main/res/mipmap-* bằng script, kèm
# adaptive icon XML. Muốn đổi icon thì sửa assets/icon/ rồi chạy lại script đó.

# ── Màn hình khởi động ────────────────────────────────────────────────────────
# Tài nguyên splash ĐÃ được sinh vào android/app/src/main/res/ rồi, nên gói
# `flutter_native_splash` đã được gỡ khỏi dependencies.
#
# Lý do phải gỡ: gói giải về bản 2.2.16 (cũ), và bản đó thiếu khai báo
# `namespace` trong build.gradle của chính nó — AGP mới bắt buộc phải có, nên
# mọi lần build APK đều dừng ở bước cấu hình project.
#
# Muốn đổi màn hình khởi động: thêm tạm gói lại, chỉnh cấu hình, chạy
# `dart run flutter_native_splash:create`, rồi gỡ gói ra lần nữa.
