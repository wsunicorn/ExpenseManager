org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Tắt biên dịch tăng dần của Kotlin.
#
# Trên máy này, task :android_file_picker:compileDebugKotlin luôn thất bại với
# "Could not close incremental caches ... class-fq-name-to-source.tab". Lỗi lặp
# lại kể cả sau `flutter clean`, nên không phải trạng thái cũ — nhiều khả năng
# do antivirus giữ khoá các file .tab trong lúc Kotlin ghi.
#
# Đánh đổi: build lại toàn bộ mỗi lần, chậm hơn vài chục giây. Chấp nhận được
# so với việc không build được.
#
# Cách khác nếu muốn lấy lại tốc độ: loại trừ thư mục project và ~/.gradle khỏi
# Windows Defender (03_SETUP_WINDOWS.md mục 6 có nhắc), rồi bỏ dòng này.
kotlin.incremental=false
