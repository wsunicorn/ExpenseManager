# Tự build APK đã ký khi tạo tag. Đặc tả: ke-hoach-app/05_BUILD_APK_CI.md
#
# Cách dùng: đánh tag rồi đẩy lên.
#     git tag v1.0.0 && git push origin v1.0.0
# Vài phút sau, APK đã ký nằm ở mục Releases của repo — tải thẳng từ điện thoại.
#
# ── Bốn secret cần thêm trước khi chạy được ───────────────────────────────────
# Settings → Secrets and variables → Actions → New repository secret
#
#   KEYSTORE_BASE64   nội dung file .p12 mã hoá base64
#   STORE_PASSWORD    mật khẩu keystore
#   KEY_PASSWORD      mật khẩu khoá (thường trùng mật khẩu keystore)
#   KEY_ALIAS         sothuchi
#
# Lấy chuỗi base64 trên Windows PowerShell:
#   [Convert]::ToBase64String([IO.File]::ReadAllBytes("C:\Users\Admin\.android-keys\sothuchi.p12")) | Set-Clipboard
#
# File keystore KHÔNG BAO GIỜ được commit — nó chỉ tồn tại trên máy bạn và
# trong secret của GitHub.

name: Build APK

on:
  push:
    tags:
      - 'v*'
  # Cho phép bấm chạy tay để thử workflow mà không cần tạo tag.
  workflow_dispatch:

# GITHUB_TOKEN mặc định CHỈ CÓ QUYỀN ĐỌC ở repo mới. Tạo release cần quyền
# ghi, thiếu dòng này thì bước cuối chết với "403 Resource not accessible by
# integration" — mà mọi bước trước đó đều xanh, nên rất dễ tưởng do secret sai.
#
# Chỉ xin đúng một quyền cần dùng, không xin `write-all`.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cài Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cài Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Lấy dependencies
        run: flutter pub get

      # Chạy trước khi build: hỏng test thì đừng phát hành.
      - name: Phân tích tĩnh
        run: flutter analyze

      - name: Chạy test
        run: flutter test

      - name: Khôi phục keystore từ secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/sothuchi.p12

      - name: Tạo key.properties
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cat > android/key.properties <<EOF
          storeFile=sothuchi.p12
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build APK tách theo ABI
        run: flutter build apk --release --split-per-abi

      # Xoá ngay sau khi build, không để bí mật nằm lại trong workspace.
      - name: Dọn bí mật
        if: always()
        run: rm -f android/app/sothuchi.p12 android/key.properties

      - name: Đưa APK lên Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/app/outputs/flutter-apk/*-release.apk
          body: |
            Cài bản **arm64-v8a** cho điện thoại Android đời mới.

            | File | Dùng cho |
            |---|---|
            | `app-arm64-v8a-release.apk` | hầu hết máy từ 2018 trở đi |
            | `app-armeabi-v7a-release.apk` | máy cũ, 32-bit |
            | `app-x86_64-release.apk` | máy ảo |

      # Khi bấm chạy tay (không có tag) thì chỉ đính kèm APK vào lần chạy.
      - name: Đính kèm APK vào lần chạy
        uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          name: apk-release
          path: build/app/outputs/flutter-apk/*-release.apk
